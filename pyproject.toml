[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cdc-pipeline"
version = "0.1.0"
description = "Postgres -> Debezium -> Kafka -> idempotent warehouse sink with DLQ and event-time windows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Subramani R" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
runtime = ["confluent-kafka>=2.4", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
